<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23020C0A%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22none%22 stroke=%22%23FCEA10%22 stroke-width=%221.6%22/%3E%3C/svg%3E" />
    <title>OPTIMO Operations Centre</title>
    <script>
      // Apply saved theme (dark by default, the brand look) and language before first paint.
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('opt.theme');
          var l = localStorage.getItem('opt.lang');
          d.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
          if (l === 'ar') { d.lang = 'ar'; d.dir = 'rtl'; }
        } catch (e) { d.setAttribute('data-theme', 'dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
